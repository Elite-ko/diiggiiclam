body::before{
  content:'';
  position:fixed;
  inset:0;
  background:linear-gradient(180deg,rgba(224,234,196,.32),rgba(224,234,196,.44) 40%,rgba(224,234,196,.56));
  z-index:0;
  pointer-events:none;
}
.wrap{position:relative;z-index:1}

/* header */
.header{text-align:center;padding:2.25rem 1rem 1.1rem}
.header-card{
  display:inline-block;
  padding:1.1rem 1.8rem 1.2rem;
  border-radius:var(--radius-lg);
  background:var(--glass);
  border:1px solid var(--glass-border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:var(--shadow-soft);
}
.header h1{
  font-family:'Noto Serif Devanagari','Cormorant Garamond',serif;
  font-size:32px;
  font-weight:700;
  letter-spacing:.01em;
  color:var(--ink);
}
.header h1 .suffix{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:.6em;
  font-weight:700;
  letter-spacing:.01em;
  margin-left:4px;
  text-transform:lowercase;
  color:var(--accent-deep);
  vertical-align:middle;
  display:inline-block;
  transform:rotate(-4deg) translateY(-2px);
  position:relative;
}
.header h1 .suffix::after{
  content:'';
  position:absolute;
  left:1px;right:1px;bottom:-3px;
  height:2px;
  background:var(--accent);
  border-radius:2px;
  opacity:.55;
}
.header p{
  font-family:'Manrope',sans-serif;
  font-size:11.5px;
  color:var(--ink-soft);
  margin-top:6px;
  letter-spacing:.16em;
  text-transform:uppercase;
}

/* stars deco */

/* mode toggle */
.mode-toggle{
  display:flex;gap:2px;margin:1.1rem auto;width:fit-content;
  border:1px solid var(--glass-border);
  border-radius:16px;overflow:hidden;
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-soft);
  padding:4px;
}
.mode-btn{
  padding:10px 26px;font-size:12px;font-weight:700;border:none;background:transparent;
  cursor:pointer;color:var(--ink-soft);transition:all .18s;border-radius:13px;letter-spacing:.12em;
  font-family:'Manrope',sans-serif;text-transform:uppercase;
}
.mode-btn.active{background:var(--glass-strong);color:var(--ink);box-shadow:0 2px 8px rgba(60,45,35,.08)}

/* camera view */
#cameraSection{display:none;padding:0 1rem}
#cameraSection.active{display:block}
.camera-frame{
  position:relative;border-radius:var(--radius-lg);overflow:hidden;background:#161412;
  aspect-ratio:3/4;max-width:400px;margin:0 auto;
  border:1px solid var(--glass-border);
  box-shadow:var(--shadow-lift);
}
#liveVideo{width:100%;height:100%;object-fit:cover;display:block}
.shutter-wrap{text-align:center;margin-top:1.4rem}
.shutter-btn{
  width:72px;height:72px;border-radius:50%;background:var(--glass-strong);
  border:1px solid var(--glass-border);cursor:pointer;
  box-shadow:var(--shadow-soft);transition:transform .12s,box-shadow .12s;
  display:inline-flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);
}
.shutter-btn:active{transform:scale(.93);box-shadow:0 4px 14px rgba(60,45,35,.14)}
.shutter-inner{width:52px;height:52px;border-radius:50%;background:var(--accent)}

/* upload zone */
#uploadSection{padding:0 1rem}
.upload-zone{
  border:1.5px solid var(--glass-border);
  border-radius:var(--radius-lg);
  padding:2.75rem 1rem;text-align:center;cursor:pointer;
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-soft);
  transition:transform .15s,box-shadow .15s,background .15s;
}
.upload-zone:hover{background:var(--glass-strong);box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.cam-icon{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent-deep);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;opacity:.7}
.cam-icon::after{content:'';width:14px;height:14px;border-radius:50%;background:var(--accent)}
.upload-zone p{font-size:14px;color:var(--ink);font-weight:600;letter-spacing:.01em}
.upload-zone span{font-size:11.5px;color:var(--ink-faint);margin-top:5px;display:block;letter-spacing:.06em;text-transform:uppercase}
#fileInput{display:none}

/* workspace */
#workspace{display:none;padding:0 1rem}
#workspace.active{display:block}

.preview-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  padding:12px;margin-bottom:1.4rem;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-soft);
}
.preview-wrap{position:relative;border-radius:var(--radius-md);overflow:hidden;background:#d8cfc4;line-height:0}
canvas{width:100%;height:auto;display:block;border-radius:var(--radius-md)}
.film-tag{
  position:absolute;bottom:12px;left:12px;font-size:10px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;background:var(--glass-strong);color:var(--ink);
  padding:5px 12px;border-radius:20px;backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.7);
}

/* film grid */
.section-label{
  font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);margin:1.1rem 0 .7rem;padding:0 .35rem;
}
.films{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1.1rem}
.film-btn{
  border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:11px 6px;
  cursor:pointer;background:var(--glass);color:var(--ink-soft);text-align:center;
  font-size:11px;font-weight:600;transition:all .14s;line-height:1.3;letter-spacing:.02em;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.film-btn:active{transform:scale(.96)}
.film-btn.active{border-color:var(--accent);background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-soft)}
.film-btn .dot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px;border:1.5px solid rgba(255,255,255,.8);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* sliders */
.slider-card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  padding:1.1rem 1.1rem .9rem;margin-bottom:1.1rem;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:var(--shadow-soft);
}
.slider-row{margin-bottom:.75rem}
.slider-row:last-child{margin-bottom:0}
.slider-row label{
  display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;
  color:var(--ink-soft);margin-bottom:8px;text-transform:uppercase;letter-spacing:.1em;
}
.slider-row label span{color:var(--accent-deep);font-weight:700}
input[type=range]{width:100%;-webkit-appearance:none;height:4px;background:rgba(60,45,35,.14);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--accent);cursor:pointer;border:3px solid #fff;
  box-shadow:0 2px 6px rgba(60,45,35,.25);
}
input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer;
  border:3px solid #fff;box-shadow:0 2px 6px rgba(60,45,35,.25);
}

/* actions */
.actions{display:flex;gap:10px;margin-bottom:1rem}
.btn{
  flex:1;padding:15px;border-radius:var(--radius-sm);border:1px solid var(--glass-border);
  background:var(--glass);color:var(--ink);font-size:13.5px;font-weight:700;cursor:pointer;
  transition:all .14s;text-align:center;letter-spacing:.04em;text-transform:uppercase;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow-soft);
  font-family:'Manrope',sans-serif;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border-color:transparent}
.btn.primary:active{filter:brightness(.95)}

/* deco stars floating */
.deco{position:fixed;pointer-events:none;z-index:0;opacity:.4;color:var(--accent-deep)}
.deco-tl{top:50px;left:14px;font-size:24px;transform:rotate(-15deg)}
.deco-tr{top:70px;right:18px;font-size:19px;transform:rotate(20deg)}
.deco-br{bottom:110px;right:16px;font-size:22px;transform:rotate(-10deg)}

/* flash effect */
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:999;transition:opacity .05s}
.flash.go{opacity:1}
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<div class="wrap">

<div class="header">
  <div class="header-card">
    <h1>डिजी<span class="suffix">cam</span></h1>
    <p>shoot · filter · keep</p>
  </div>
</div>

<div style="text-align:center">
  <div class="mode-toggle">
    <button class="mode-btn active" id="btnUpload" onclick="setMode('upload')">UPLOAD</button>
    <button class="mode-btn" id="btnCamera" onclick="setMode('camera')">CAM</button>
  </div>
</div>

<!-- upload mode -->
<div id="uploadSection">
  <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="cam-icon"></div>
    <p>tap to pick a photo</p>
    <span>jpg · png · webp</span>
  </div>
  <input type="file" id="fileInput" accept="image/*" capture="environment">
</div>

<!-- camera mode -->
<div id="cameraSection">
  <div class="camera-frame">
    <video id="liveVideo" autoplay playsinline muted></video>
  </div>
  <div class="shutter-wrap">
    <button class="shutter-btn" id="shutterBtn" onclick="snapPhoto()">
      <div class="shutter-inner"></div>
    </button>
  </div>
</div>

<!-- workspace shown after photo -->
<div id="workspace">
  <div class="preview-card">
    <div class="preview-wrap">
      <canvas id="output"></canvas>
      <div class="film-tag" id="filmTag">original</div>
    </div>
  </div>

  <div class="section-label">film stock</div>
  <div class="films" id="filmGrid"></div>

  <div class="slider-card">
    <div class="slider-row">
      <label>grain <span id="grainVal">30</span></label>
      <input type="range" min="0" max="100" value="30" step="1" id="grainSlider">
    </div>
  </div>

  <div class="actions">
    <button class="btn" onclick="resetAll()">retake</button>
    <button class="btn primary" id="dlBtn">save ↓</button>
  </div>
</div>

</div>

    matrix:[1.06,0.02,-0.01,0.01,1.03,0.01,-0.02,0.02,0.92],bias:[6,2,2],shadow:[6,3,2],sat:0.94},
  {id:'fuji',name:'Fuji Superia',dot:'#90c8a0',
    matrix:[1.0,0.0,-0.03,0.0,1.05,0.02,-0.01,0.03,1.0],bias:[0,4,2],shadow:[0,5,3],sat:1.05},
  {id:'cinestill',name:'CineStill 800T',dot:'#6080c8',
    matrix:[0.90,0.04,0.10,0.0,1.0,0.04,0.0,0.0,1.12],bias:[0,2,12],shadow:[0,2,10],sat:1.05},
  {id:'hp5',name:'Ilford HP5',dot:'#888',bw:true,contrast:1.08},
  {id:'ektar',name:'Ektar 100',dot:'#e06050',
    matrix:[1.15,0.02,-0.03,0.0,1.06,0.0,0.01,0.01,0.86],bias:[6,0,-6],shadow:[8,0,-4],sat:1.18},
];

let img=null,currentFilm=films[0],grainAmt=30;
let offCanvas=null,offCtx=null,stream=null;

const canvas=document.getElementById('output');
const ctx=canvas.getContext('2d');

// cache frequently used DOM nodes once
const els={
  uploadSection:document.getElementById('uploadSection'),
  workspace:document.getElementById('workspace'),
  fileInput:document.getElementById('fileInput'),
  grainSlider:document.getElementById('grainSlider'),
  grainVal:document.getElementById('grainVal'),
  filmTag:document.getElementById('filmTag'),
  btnUpload:document.getElementById('btnUpload'),
  btnCamera:document.getElementById('btnCamera'),
  cameraSection:document.getElementById('cameraSection'),
  liveVideo:document.getElementById('liveVideo'),
  flash:document.getElementById('flash'),
};

// film buttons
const filmGrid=document.getElementById('filmGrid');
films.forEach(f=>{
  const btn=document.createElement('div');
  btn.className='film-btn'+(f===currentFilm?' active':'');
  btn.innerHTML=`<div class="dot" style="background:${f.dot}"></div>${f.name}`;
  btn.onclick=()=>{
    document.querySelectorAll('.film-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentFilm=f;render();
  };
  filmGrid.appendChild(btn);
});

els.grainSlider.oninput=function(){
  grainAmt=+this.value;
  els.grainVal.textContent=this.value;
  render();
};

// mode switching
function setMode(m){
  els.btnUpload.classList.toggle('active',m==='upload');
  els.btnCamera.classList.toggle('active',m==='camera');
  els.uploadSection.style.display=m==='upload'?'block':'none';
  if(m==='camera'){
    els.cameraSection.classList.add('active');
    startCamera();
  } else {
    els.cameraSection.classList.remove('active');
    stopCamera();
  }
}

function startCamera(){
  if(stream) return;
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
    .then(s=>{
      stream=s;
      els.liveVideo.srcObject=s;
    })
    .catch(()=>alert('camera access denied or not available'));
}

function stopCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
}

function snapPhoto(){
  els.flash.classList.add('go');
  setTimeout(()=>els.flash.classList.remove('go'),120);
  const video=els.liveVideo;
  const tmp=document.createElement('canvas');
  tmp.width=video.videoWidth;tmp.height=video.videoHeight;
  tmp.getContext('2d').drawImage(video,0,0);
  const i=new Image();
  i.onload=()=>loadImage(i);
  i.src=tmp.toDataURL('image/jpeg',.95);
  stopCamera();
  setMode('upload');
}

// file upload
const dropZone=document.getElementById('dropZone');
dropZone.addEventListener('dragover',e=>{e.preventDefault()});
dropZone.addEventListener('drop',e=>{e.preventDefault();loadFile(e.dataTransfer.files[0])});
els.fileInput.onchange=e=>loadFile(e.target.files[0]);

function loadFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const i=new Image();
    i.onload=()=>loadImage(i);
    i.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

function loadImage(i){
  img=i;
  offCanvas=document.createElement('canvas');
  offCanvas.width=i.width;offCanvas.height=i.height;
  offCtx=offCanvas.getContext('2d');
  canvas.width=i.width;canvas.height=i.height;
  els.uploadSection.style.display='none';
  els.workspace.classList.add('active');
  render();
}

function resetAll(){
  img=null;
  els.workspace.classList.remove('active');
  els.uploadSection.style.display='block';
  els.fileInput.value='';
  els.grainSlider.value=30;
  grainAmt=30;
  els.grainVal.textContent=30;
  currentFilm=films[0];
  document.querySelectorAll('.film-btn').forEach((b,i)=>{b.classList.toggle('active',i===0)});
}

function clamp(v){return Math.max(0,Math.min(255,Math.round(v)))}

function render(){
  if(!img)return;
  offCtx.drawImage(img,0,0);
  const data=offCtx.getImageData(0,0,offCanvas.width,offCanvas.height);
  const d=data.data;
  const f=currentFilm;

  // resolve film flags once, instead of re-checking per pixel
  const isBw=!!f.bw;
  const contrast=f.contrast||1;
  const m=f.matrix||null;
  const bias=f.bias||null;
  const shadow=f.shadow||null;
  const sat=(f.sat&&f.sat!==1)?f.sat:null;
  const grain=grainAmt>0?grainAmt*.7:0;

  for(let i=0;i<d.length;i+=4){
    let r=d[i],g=d[i+1],b=d[i+2];

    if(isBw){
      let lum=0.299*r+0.587*g+0.114*b;
      if(contrast!==1)lum=clamp((lum-128)*contrast+128);
      r=g=b=clamp(lum);
    } else if(m){
      let nr=m[0]*r+m[1]*g+m[2]*b;
      let ng=m[3]*r+m[4]*g+m[5]*b;
      let nb=m[6]*r+m[7]*g+m[8]*b;
      if(bias){nr+=bias[0];ng+=bias[1];nb+=bias[2];}
      if(shadow){const lum=(r+g+b)/765,sf=1-lum;nr+=shadow[0]*sf*.4;ng+=shadow[1]*sf*.4;nb+=shadow[2]*sf*.4;}
      r=clamp(nr);g=clamp(ng);b=clamp(nb);
      if(sat){const lum=0.299*r+0.587*g+0.114*b;r=clamp(lum+(r-lum)*sat);g=clamp(lum+(g-lum)*sat);b=clamp(lum+(b-lum)*sat);}
    }

    if(grain){const n=(Math.random()-.5)*grain;r=clamp(r+n);g=clamp(g+n*.95);b=clamp(b+n);}

    d[i]=r;d[i+1]=g;d[i+2]=b;
  }
  ctx.putImageData(data,0,0);
  els.filmTag.textContent=f.id==='original'?'original':f.name;
}

document.getElementById('dlBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=canvas.toDataURL('image/jpeg',.95);
  a.download='digicam_'+currentFilm.id+'.jpg';
  a.click();
};
</script>
</body>
</html>
